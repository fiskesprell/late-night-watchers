<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 300" width="578" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        fill: #eef0f7;
        stroke: #171830;
        stroke-width: 6;
        paint-order: stroke fill;
        stroke-linejoin: round;
      }
    </style>
    <clipPath id="circleClip">
      <circle cx="289" cy="148" r="138"/>
    </clipPath>
  </defs>

  <!-- Everything below is clipped into a perfect circle -->
  <g clip-path="url(#circleClip)">

    <!-- Red sky (top of circle) with jagged mountain skyline as its bottom edge -->
    <path fill="#f22a3a" d="
      M90,0 L490,0 L490,140
      L455,118 L430,133 L405,100 L382,128 L358,96
      L336,112 L312,84 L288,112 L264,88 L242,118
      L220,92 L198,128 L173,102 L148,136 L120,116 L90,142 Z"/>

    <!-- Horizontal perspective stripes filling the lower part of the circle -->
    <g>
      <rect x="0" y="150" width="578" height="6"  fill="#5477e0"/>
      <rect x="0" y="160" width="578" height="6"  fill="#5477e0"/>
      <rect x="0" y="170" width="578" height="7"  fill="#5477e0"/>
      <rect x="0" y="181" width="578" height="7"  fill="#5477e0"/>
      <rect x="0" y="192" width="578" height="8"  fill="#5477e0"/>
      <rect x="0" y="204" width="578" height="8"  fill="#5477e0"/>
      <rect x="0" y="216" width="578" height="9"  fill="#5477e0"/>
      <rect x="0" y="229" width="578" height="10" fill="#5477e0"/>
      <rect x="0" y="243" width="578" height="11" fill="#5477e0"/>
      <rect x="0" y="258" width="578" height="12" fill="#5477e0"/>
      <rect x="0" y="274" width="578" height="14" fill="#5477e0"/>
      <rect x="0" y="292" width="578" height="16" fill="#5477e0"/>
    </g>
  </g>

  <!-- Text sits on top, overlapping the circle -->
  <text x="289" y="175" text-anchor="middle" class="logo-text" font-size="64"
        textLength="522" lengthAdjust="spacingAndGlyphs">Late Night Watchers</text>
</svg>
