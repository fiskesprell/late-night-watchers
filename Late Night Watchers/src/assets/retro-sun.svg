<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="sun-circle">
      <circle cx="100" cy="100" r="90"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sun-circle)">
    <!-- Red top half -->
    <rect x="10" y="10" width="180" height="90" fill="#F5163A"/>

    <!-- Blue horizontal stripes, bottom half -->
    <rect x="10" y="100" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="110" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="120" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="130" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="140" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="150" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="160" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="170" width="180" height="6" fill="#3D8EF7"/>
    <rect x="10" y="180" width="180" height="10" fill="#3D8EF7"/>
  </g>
</svg>
